<style>
  :root{
    --bg:#14110d;
    --bg2:#1a1611;
    --card:#211c16;
    --card2:#26201a;
    --line:#3a3128;
    --line2:#4a4034;
    --ink:#f3ecdf;
    --ink2:#b8ab97;
    --ink3:#8a7e6c;
    --gold:#f5a524;
    --gold-soft:#3a2c12;
    --teal:#2dd4bf;
    --teal-soft:#103230;
    --coral:#ff6b5b;
    --coral-soft:#3a1c18;
    --radius:14px;
    --mono:'Space Mono',monospace;
    --disp:'Space Grotesk',sans-serif;
    --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  ::selection{background:var(--gold);color:#14110d}

  /* HEADER */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(20,17,13,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .head-inner{
    max-width:1080px;margin:0 auto;padding:18px 22px 0;
  }
  .titlebar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .brand{font-family:var(--disp);font-weight:700;font-size:clamp(22px,4vw,30px);letter-spacing:-.5px;line-height:1.05}
  .brand .b{color:var(--gold)}
  .sub{font-family:var(--mono);font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px}
  .badge{
    font-family:var(--mono);font-size:11px;font-weight:700;
    color:var(--coral);border:1px solid var(--coral);
    padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:1px;
    white-space:nowrap;
  }
  /* NAV PILLS */
  nav{display:flex;gap:8px;overflow-x:auto;padding:14px 0 14px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .pill{
    flex:0 0 auto;
    font-family:var(--disp);font-weight:600;font-size:13px;
    color:var(--ink2);background:var(--card);
    border:1px solid var(--line);
    padding:8px 14px;border-radius:999px;cursor:pointer;
    transition:.15s;white-space:nowrap;
    display:flex;align-items:center;gap:7px;
  }
  .pill .num{font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .pill:hover{border-color:var(--line2);color:var(--ink)}
  .pill.active{background:var(--gold);color:#14110d;border-color:var(--gold)}
  .pill.active .num{color:#5a3d08}

  /* MAIN */
  main{max-width:1080px;margin:0 auto;padding:30px 22px 0}
  .panel{display:none;animation:fade .35s ease}
  .panel.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .panel-head{margin-bottom:24px}
  .eyebrow{font-family:var(--mono);font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
  .panel-title{font-family:var(--disp);font-weight:700;font-size:clamp(24px,5vw,34px);letter-spacing:-.6px;line-height:1.1}
  .panel-intro{color:var(--ink2);margin-top:10px;max-width:62ch;font-size:15px}

  /* CARD */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 22px 8px;
    margin-bottom:18px;
  }
  .card-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .tag{font-family:var(--mono);font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px;border:1px solid var(--line);padding:2px 8px;border-radius:6px}
  .card h3{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.3px;margin:8px 0 2px;color:var(--ink)}
  .card p{font-size:14.5px;color:var(--ink2);margin:8px 0}
  .card p strong{color:var(--ink);font-weight:600}

  /* FORMULA BLOCK */
  .formula{
    background:linear-gradient(135deg,var(--gold-soft),var(--bg2));
    border:1px solid #5a4416;border-left:4px solid var(--gold);
    border-radius:10px;padding:14px 18px;margin:14px 0;
    overflow-x:auto;
  }
  .formula .lab{font-family:var(--mono);font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;display:block}
  .formula mjx-container{color:var(--ink) !important}

  /* METHOD STEPS */
  .method{margin:12px 0}
  .method .lab{font-family:var(--mono);font-size:10px;color:var(--teal);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;display:block}
  .method ol{list-style:none;counter-reset:step;padding:0}
  .method li{counter-increment:step;position:relative;padding:5px 0 5px 32px;font-size:14.5px;color:var(--ink2)}
  .method li::before{
    content:counter(step);position:absolute;left:0;top:5px;
    width:21px;height:21px;border-radius:6px;
    background:var(--teal-soft);border:1px solid var(--teal);color:var(--teal);
    font-family:var(--mono);font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }

  /* EXAMPLE (reveal) */
  .ex{border:1px solid var(--line);border-radius:10px;margin:14px 0;overflow:hidden;background:var(--bg2)}
  .ex-q{padding:13px 16px;font-size:14.5px;color:var(--ink)}
  .ex-q .lab{font-family:var(--mono);font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px;display:block;margin-bottom:5px}
  .ex-btn{
    width:100%;text-align:left;cursor:pointer;
    background:var(--card2);border:none;border-top:1px solid var(--line);
    color:var(--gold);font-family:var(--disp);font-weight:600;font-size:13px;
    padding:11px 16px;display:flex;align-items:center;gap:8px;transition:.15s;
  }
  .ex-btn:hover{background:#2e2820}
  .ex-btn .chev{transition:.2s;font-family:var(--mono)}
  .ex-btn.open .chev{transform:rotate(90deg)}
  .ex-sol{max-height:0;overflow:hidden;transition:max-height .35s ease;background:var(--bg)}
  .ex-sol.open{max-height:1200px}
  .ex-sol-inner{padding:14px 16px;font-size:14px;color:var(--ink2);border-top:1px dashed var(--line2)}
  .ex-sol-inner .step{margin:7px 0}
  .ex-sol-inner .res{color:var(--teal);font-weight:600}

  /* TRAP */
  .trap{
    background:var(--coral-soft);border:1px solid #6e2c24;border-left:4px solid var(--coral);
    border-radius:10px;padding:12px 16px;margin:14px 0;
  }
  .trap .lab{font-family:var(--mono);font-size:10px;color:var(--coral);text-transform:uppercase;letter-spacing:1.5px;display:block;margin-bottom:5px;font-weight:700}
  .trap p{font-size:14px;color:#f3d4cf;margin:3px 0}
  .trap strong{color:#ffb3a8}

  /* TIP */
  .tip{
    background:var(--teal-soft);border:1px solid #1c5450;border-left:4px solid var(--teal);
    border-radius:10px;padding:12px 16px;margin:14px 0;
  }
  .tip .lab{font-family:var(--mono);font-size:10px;color:var(--teal);text-transform:uppercase;letter-spacing:1.5px;display:block;margin-bottom:5px;font-weight:700}
  .tip p{font-size:14px;color:#cdeeea;margin:3px 0}

  /* TABLE */
  .tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
  .tbl th,.tbl td{border:1px solid var(--line);padding:8px 11px;text-align:left}
  .tbl th{background:var(--card2);font-family:var(--disp);font-weight:600;color:var(--gold);font-size:13px}
  .tbl td{color:var(--ink2)}

  /* checklist */
  .check li{list-style:none;padding:8px 0 8px 30px;position:relative;font-size:14.5px;color:var(--ink2);border-bottom:1px solid var(--line)}
  .check li:last-child{border-bottom:none}
  .check li::before{content:"✓";position:absolute;left:0;top:8px;color:var(--gold);font-weight:700}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:680px){.grid2{grid-template-columns:1fr}}

  footer{max-width:1080px;margin:40px auto 0;padding:24px 22px;border-top:1px solid var(--line);color:var(--ink3);font-size:12.5px;font-family:var(--mono)}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="titlebar">
      <div>
        <div class="brand">BREVET <span class="b">MATHS</span></div>
        <div class="sub">Fiche express · révision de dernière minute</div>
      </div>
      <div class="badge">⏱ Épreuve demain</div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<main id="main"></main>

<footer>

</footer>

/* ============ RENDU ============ */
function buildFormula(f){
  return `<div class="formula">${f.map(([lab,tex])=>
    `<span class="lab">${lab}</span>\\[${tex}\\]`).join('')}</div>`;
}
function buildMethod(steps){
  return `<div class="method"><span class="lab">▸ Méthode</span><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>`;
}
function buildEx(ex,idx){
  return `<div class="ex">
    <div class="ex-q"><span class="lab">Exemple résolu</span>${ex.q}</div>
    <button class="ex-btn" data-ex="${idx}"><span class="chev">▶</span> Voir la solution</button>
    <div class="ex-sol" id="sol-${idx}"><div class="ex-sol-inner">${ex.sol.map(s=>`<div class="step">${s}</div>`).join('')}</div></div>
  </div>`;
}
function buildTrap(t){return `<div class="trap"><span class="lab">⚠ Piège à éviter</span>${t.map(p=>`<p>${p}</p>`).join('')}</div>`;}
function buildTip(t){return `<div class="tip"><span class="lab">★ Astuce</span>${t.map(p=>`<p>${p}</p>`).join('')}</div>`;}
function buildTable(tb){
  return `<table class="tbl"><thead><tr>${tb.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${tb.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function buildCheck(items){
  return `<ul class="check">${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
}

let exCounter=0;
function buildCard(c){
  let html=`<div class="card"><div class="card-top"><span class="tag">${c.tag}</span></div><h3>${c.h}</h3>`;
  if(c.p) html+=`<p>${c.p}</p>`;
  if(c.formula) html+=buildFormula(c.formula);
  if(c.method) html+=buildMethod(c.method);
  if(c.table) html+=buildTable(c.table);
  if(c.check) html+=buildCheck(c.check);
  if(c.ex){html+=buildEx(c.ex,exCounter);exCounter++;}
  if(c.tip) html+=buildTip(c.tip);
  if(c.trap) html+=buildTrap(c.trap);
  html+=`</div>`;
  return html;
}

const nav=document.getElementById('nav');
const main=document.getElementById('main');
DATA.forEach((sec,i)=>{
  const pill=document.createElement('button');
  pill.className='pill'+(i===0?' active':'');
  pill.innerHTML=`<span class="num">${sec.num}</span>${sec.nav}`;
  pill.dataset.target=sec.id;
  nav.appendChild(pill);

  const panel=document.createElement('section');
  panel.className='panel'+(i===0?' show':'');
  panel.id=sec.id;
  panel.innerHTML=`<div class="panel-head">
      <div class="eyebrow">${sec.eyebrow}</div>
      <h2 class="panel-title">${sec.title}</h2>
      <p class="panel-intro">${sec.intro}</p>
    </div>${sec.cards.map(buildCard).join('')}`;
  main.appendChild(panel);
});

/* navigation */
nav.addEventListener('click',e=>{
  const pill=e.target.closest('.pill');if(!pill)return;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  pill.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
  document.getElementById(pill.dataset.target).classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
});

/* reveal solutions */
main.addEventListener('click',e=>{
  const btn=e.target.closest('.ex-btn');if(!btn)return;
  const sol=document.getElementById('sol-'+btn.dataset.ex);
  const open=sol.classList.toggle('open');
  btn.classList.toggle('open',open);
  btn.innerHTML=`<span class="chev">▶</span> ${open?'Masquer la solution':'Voir la solution'}`;
});
</script>
